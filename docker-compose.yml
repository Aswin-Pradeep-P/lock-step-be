services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lockstep
      POSTGRES_PASSWORD: lockstep
      POSTGRES_DB: lockstep
    ports:
      - "5432:5432"
    volumes:
      - lockstep_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lockstep"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # 6379 is already taken by an unrelated container on this host
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lockstep_pg_data:
