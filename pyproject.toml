[project]
name = "lockstep-be"
version = "0.1.0"
description = "Lockstep — GST ITC reconciliation backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118,<0.119",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "email-validator>=2.2,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<1.15",
    "celery>=5.4,<5.5",
    "redis>=5.2,<6",
    "anthropic>=0.68,<1.0",
    "pandas>=2.2,<3",
    "rapidfuzz>=3.10,<4",
    "bcrypt>=4.1,<6",
    "pyjwt>=2.9,<3",
    "python-multipart>=0.0.17",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7",
    "ruff>=0.7,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI's Depends()/File()/Form() defaults are the idiomatic pattern, not a real bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501", "UP035", "UP007", "I001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lockstep"]
